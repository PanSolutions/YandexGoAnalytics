name: CD (Deploy to Target)

on:
  push:
    branches:
      - development
      - staging
      - production
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select Branch/Target to Deploy'
        required: true
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  deploy:
    name: Deploy Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy to Databricks Target
        run: |
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          echo "Processing branch: $BRANCH"

          case "$BRANCH" in
            "development")
              TARGET="dev"
              export DATABRICKS_HOST="${{ secrets.DATABRICKS_HOST_DEV }}"
              export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_DEV }}"
              ;;
            "staging")
              TARGET="staging"
              export DATABRICKS_HOST="${{ secrets.DATABRICKS_HOST_STAGING }}"
              export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_STAGING }}"
              ;;
            "production")
              TARGET="prod"
              export DATABRICKS_HOST="${{ secrets.DATABRICKS_HOST_PROD }}"
              export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_PROD }}"
              ;;
            *)
              echo "Unknown branch: $BRANCH"
              exit 1
              ;;
          esac

          echo "🚀 Deploying bundle to target: $TARGET"
          databricks bundle deploy -t $TARGET