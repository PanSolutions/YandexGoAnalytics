[project]
name = "yandexgoanalytics"
version = "0.1.0"
description = "Yandex Go Analytics Data Lakehouse Platform on Databricks"
readme = "README.md"
authors = [
    { name = "Stanislav Panfilenko", email = "stanislav.panfilenko@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "databricks-connect==19.1",
    "dotenv>=0.9.9",
    "faker>=40.39.0",
    "jupyter>=1.1.1",
    "loguru>=0.7.3",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "src"
]

testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".databricks",
    "dist",
    "build",
    "notebooks"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
