[project]
name = "yandexgoanalytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your Name", email = "youremail@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "databricks-connect>=19.1",
    "environ>=1.0",
    "faker>=40.39.0",
    "jupyter>=1.1.1",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.3",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".databricks",
    "dist",
    "build",
    "notebooks"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false